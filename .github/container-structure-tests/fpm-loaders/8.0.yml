schemaVersion: "2.0.0"

commandTests:
  - name: "ionCube Module Is Not Loaded"
    command: "php-fpm"
    args: ["-m"]
    excludedOutput:
      - "(?m)^the ionCube PHP Loader"
  - name: "ionCube Is Not Configured"
    command: "php-fpm"
    args: ["-i"]
    excludedOutput:
      - "/etc/php\\.d/01-ioncube-loader.ini"
      - "(?m)^For Loader updates visit www\\.ioncube\\.com/loaders\\.php"
      - "(?m)^ioncube\\.loader\\.encoded_paths => no value => no value"
  - name: "SourceGuardian Module Loaded"
    command: "php-fpm"
    args: ["-m"]
    expectedOutput:
      - "(?m)SourceGuardian"
  - name: "SourceGuardian Info Check"
    command: "php-fpm"
    args: ["-i"]
    expectedOutput:
      - "/etc/php\\.d/15-sourceguardian.ini"
      - "(?m)^SourceGuardian Loader Support => enabled"
      - "(?m)^sourceguardian\\.enable_debug => 0 => 0"

fileExistenceTests:
  - name: "SourceGuardian Config Exists"
    path: "/etc/php.d/15-sourceguardian.ini"
    shouldExist: true
  - name: "IonCube Config Does Not Exist"
    path: "/etc/php.d/01-ioncube-loader.ini"
    shouldExist: false