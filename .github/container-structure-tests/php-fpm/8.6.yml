schemaVersion: "2.0.0"

# ionCube and SourceGuardian have not published PHP 8.6 loaders yet
commandTests:
  - name: "ionCube Module Is Not Loaded"
    command: "php-fpm"
    args: ["-m"]
    excludedOutput:
      - "(?m)^the ionCube PHP Loader"
  - name: "ionCube Is Not Configured"
    command: "php-fpm"
    args: ["-i"]
    excludedOutput:
      - "/etc/php\\.d/01-ioncube-loader.ini"
      - "(?m)^For Loader updates visit www\\.ioncube\\.com/loaders\\.php"
      - "(?m)^ioncube\\.loader\\.encoded_paths => no value => no value"
  - name: "SourceGuardian Module Is Not Loaded"
    command: "php-fpm"
    args: ["-m"]
    excludedOutput:
      - "(?m)SourceGuardian"
  - name: "OPcache Settings Applied"
    command: "php"
    args: ["-i"]
    expectedOutput:
      - "(?m)^opcache\\.enable_cli => Off => Off"
      - "(?m)^opcache\\.memory_consumption => 512 => 512"
  - name: "Syntax Check Works"
    command: "bash"
    args: ["-c", "echo '<?php echo 1;' > /tmp/lint.php && php -l /tmp/lint.php"]
    expectedOutput:
      - "No syntax errors detected in /tmp/lint.php"

fileExistenceTests:
  - name: "IonCube Config Does Not Exist"
    path: "/etc/php.d/01-ioncube-loader.ini"
    shouldExist: false
  - name: "SourceGuardian Config Does Not Exist"
    path: "/etc/php.d/15-sourceguardian.ini"
    shouldExist: false

fileContentTests:
  - name: "OpCache Config Only"
    path: "/etc/php.d/10-opcache.ini"
    excludedContents: ['^zend_extension=.*']
