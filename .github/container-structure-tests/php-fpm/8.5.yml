schemaVersion: "2.0.0"

commandTests:
  - name: "ionCube Module Loaded"
    command: "php-fpm"
    args: ["-m"]
    expectedOutput:
      - "(?m)^the ionCube PHP Loader"
  - name: "ionCube Configured"
    command: "php-fpm"
    args: ["-i"]
    expectedOutput:
      - "/etc/php\\.d/01-ioncube-loader.ini"
      - "(?m)^For Loader updates visit www\\.ioncube\\.com/loaders\\.php"
      - "(?m)^ioncube\\.loader\\.encoded_paths => no value => no value"

  - name: "OPcache Settings Applied"
    command: "php"
    args: ["-i"]
    expectedOutput:
      - "(?m)^opcache\\.enable_cli => Off => Off"
      - "(?m)^opcache\\.memory_consumption => 512 => 512"
  - name: "Syntax Check Works With ionCube Loaded"
    command: "bash"
    args: ["-c", "echo '<?php echo 1;' > /tmp/lint.php && php -l /tmp/lint.php"]
    expectedOutput:
      - "No syntax errors detected in /tmp/lint.php"
  - name: "SourceGuardian Module Loaded"
    command: "php-fpm"
    args: ["-m"]
    expectedOutput:
      - "(?m)SourceGuardian"

fileExistenceTests:
  - name: "IonCube Config Exists"
    path: "/etc/php.d/01-ioncube-loader.ini"
    shouldExist: true

fileContentTests:
  - name: "OpCache Config Only"
    path: "/etc/php.d/10-opcache.ini"
    excludedContents: ['^zend_extension=.*']
